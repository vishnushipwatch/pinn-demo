<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111a2b">
  <title>PINN PINN Model Demo</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#eef2f6;--muted:#a4afbf;--line:#29354a;--paper:#111a2b;--white:#182337;--green:#81c915;--mint:#b8e2c8;--orange:#ed9b63;--shadow:0 16px 42px rgba(0,0,0,.22)}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 72% 7%,#1b2940 0%,transparent 38%),linear-gradient(145deg,#111a2b,#0d1522 68%,#111d27);color:var(--ink);font-family:Manrope, sans-serif;min-height:100vh}
    button,input{font:inherit}
    .shell{max-width:1440px;margin:auto;padding:30px clamp(16px,4vw,56px) 36px}
    .topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 0 18px}
    .brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:800;letter-spacing:.02em}
    .brand-mark{width:32px;height:32px;display:grid;place-items:center}
    .brand-mark img{width:24px;height:24px;object-fit:contain}
    .eyebrow,.mono{font-family:"DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase}
    .eyebrow{font-size:12px;color:var(--green);font-weight:700}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:stretch}
    .plot-panel,.side-panel,.timeline{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow)}
    .plot-panel{min-width:0;border-radius:7px;overflow:hidden;display:flex;flex-direction:column}
    .plot-head{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 0;gap:12px}
    .plot-head h2{font-size:16px;margin:0;font-weight:800}
    .plot-sub{display:none}
    #plot{height:min(64vh,570px);min-height:350px;width:100%}
    .plot-foot{display:none}
    .timeline{border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:none;margin-top:auto;padding:17px 20px 15px;background:transparent}
    .timeline-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .time-label{font-size:15px;font-weight:800}
    .time-label strong{color:var(--green);font-family:"DM Mono",monospace;font-weight:500;font-size:16px}
    input[type=range]{appearance:none;width:100%;height:22px;background:transparent;margin:11px 0 0;cursor:pointer;touch-action:pan-y}
    input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:5px;background:linear-gradient(to right,var(--green) 0%,var(--green) var(--progress,0%),#354155 var(--progress,0%),#354155 100%)}
    input[type=range]::-moz-range-track{height:4px;border-radius:5px;background:#354155}
    input[type=range]::-moz-range-progress{height:4px;background:var(--green);border-radius:5px}
    input[type=range]::-webkit-slider-thumb{appearance:none;width:17px;height:17px;border-radius:50%;background:#eaf0f4;border:4px solid var(--green);margin-top:-6.5px;box-shadow:0 1px 7px #0008}
    input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#eaf0f4;border:4px solid var(--green);box-shadow:0 1px 7px #0008}
    .ticks{display:flex;justify-content:space-between;color:#8f9bac;font:11px "DM Mono",monospace;margin-top:2px}
    .weather-diagram{display:grid;grid-template-columns:minmax(120px,1fr);align-items:center;justify-content:center;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
    .compass{width:min(100%,260px);justify-self:center;aspect-ratio:1}
    .compass svg{display:block;width:100%;height:100%;overflow:visible}
    #windGusts{opacity:var(--wind-strength,0)}
    #windGusts path{animation:wind-streak var(--wind-duration,2s) ease-in infinite;transform-box:fill-box;transform-origin:center}
    #windGusts path:nth-child(2){animation-delay:calc(var(--wind-duration,2s) * -.34)}
    #windGusts path:nth-child(3){animation-delay:calc(var(--wind-duration,2s) * -.67)}
    @keyframes wind-streak{from{transform:translateY(-8px);opacity:.2}to{transform:translateY(14px);opacity:1}}
    #waveMotion{opacity:var(--wave-strength,0);animation:wave-flow var(--wave-duration,3s) ease-in infinite}
    @keyframes wave-flow{from{transform:translateY(-12px)}to{transform:translateY(20px)}}
    .weather-controls{display:grid;grid-template-columns:minmax(240px,36%) minmax(0,1fr);grid-template-rows:repeat(4,minmax(54px,auto));gap:10px 28px;margin-top:17px;align-items:center}
    .weather-diagram{grid-column:1;grid-row:1 / span 4}
    .weather-control{grid-column:2;min-width:0}
    .weather-label{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
    .weather-label strong{color:var(--green);font:12px "DM Mono",monospace;white-space:nowrap}
    .weather-control .ticks{font-size:10px}
    @media(max-width:850px){.workspace{grid-template-columns:1fr}}
    @media(max-width:560px){.shell{padding:17px 12px 24px}.topbar{padding-bottom:13px}.plot-head{padding:14px 13px 0}.plot-head h2{font-size:14px}#plot{height:390px;min-height:350px}.timeline{padding:15px 14px}.timeline-top{align-items:start}.weather-diagram{grid-column:auto;grid-row:auto;grid-template-columns:minmax(0,1fr);padding:17px 0 14px}.weather-controls{grid-template-columns:1fr;grid-template-rows:auto;gap:10px;margin-top:14px}.weather-control{grid-column:auto;display:grid;grid-template-columns:100px minmax(0,1fr) 40px;align-items:center;gap:10px}.weather-control input[type=range]{margin:0}.weather-control .ticks{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><img src="shipwatch.svg" alt=""></span>PINN Model Demo</div>
    </header>
    <section class="workspace" aria-label="Interactive vessel performance model">
      <article class="plot-panel">
        <div class="plot-head"><div><h2>Speed · Draft · Consumption</h2></div></div>
        <div id="plot" role="img" aria-label="Fixed-frame 3D graph of speed, draft, and consumption for the current model"></div>
        <div class="plot-foot"><span>Drag to rotate · scroll to zoom</span><span>Illustrative normalized vessel data</span></div>
        <section class="timeline" aria-label="Model progression and weather controls">
          <div class="timeline-top"><div class="time-label">Timeline:  <strong id="timeValue">Baseline</strong></div></div>
          <input id="timeSlider" type="range" min="0" max="12" step="0.1" value="0" aria-label="Advance model from baseline to three months">
          <div class="ticks"><span>BASELINE</span><span>1 MONTH</span><span>2 MONTHS</span><span>3 MONTHS</span></div>
          <div class="weather-controls" aria-label="Weather conditions">
            <div class="weather-diagram" role="img" aria-label="Compass diagram showing incoming wind and wave directions relative to the vessel, Beaufort force, and Douglas sea state">
              <div class="compass">
                <svg viewBox="0 0 240 240" aria-hidden="true">
                  <circle cx="120" cy="120" r="105" fill="#111a2b" stroke="#354155" stroke-width="1.5"/>
                  <circle cx="120" cy="120" r="78" fill="none" stroke="#29354a" stroke-width="1" stroke-dasharray="2 5"/>
                  <path d="M120 32v176M32 120h176M58 58l124 124M182 58 58 182" stroke="#344056" stroke-width="1"/>
                  <text x="120" y="20" text-anchor="middle" fill="#a4afbf" font-size="10" font-family="DM Mono,monospace">0° · BOW</text>
                  <text x="120" y="44" text-anchor="middle" fill="#718096" font-size="8" font-family="DM Mono,monospace">WIND / WAVES FROM</text>
                  <text x="120" y="232" text-anchor="middle" fill="#718096" font-size="9" font-family="DM Mono,monospace">S</text>
                  <text x="10" y="123" text-anchor="start" fill="#718096" font-size="9" font-family="DM Mono,monospace">W</text>
                  <text x="230" y="123" text-anchor="end" fill="#718096" font-size="9" font-family="DM Mono,monospace">E</text>
                  <g id="windBearing"><line x1="120" y1="20" x2="120" y2="76" stroke="#68c3dd" stroke-width="4" stroke-linecap="round"/><path d="M120 84l-7-13h14z" fill="#68c3dd"/><g id="windGusts" fill="none" stroke="#9be5f5" stroke-width="2.5" stroke-linecap="round"><path d="M110 30v22"/><path d="M120 26v28"/><path d="M130 30v22"/></g></g>
                  <g id="waveBearing"><line x1="120" y1="20" x2="120" y2="67" stroke="#f0a35f" stroke-width="3" stroke-linecap="round"/><path d="M120 75l-6-12h12z" fill="#f0a35f"/><g id="waveMotion" fill="none" stroke="#ffd0a4" stroke-width="2" stroke-linecap="round"><g class="wave-symbol"><path d="M108 31q7-8 13-1t11 1"/></g><g class="wave-symbol" transform="translate(0 18)"><path d="M108 31q7-8 13-1t11 1"/></g></g></g>
                  <path d="M120 82c-8 12-13 24-13 38v34c0 7 5 12 13 12s13-5 13-12v-34c0-14-5-26-13-38z" fill="#dce5e9" stroke="#f6fbfc" stroke-width="1.5"/>
                  <path d="M120 90v66" stroke="#80919b" stroke-width="1.5"/>
                  <circle cx="120" cy="120" r="4" fill="#81c915" stroke="#111a2b" stroke-width="2"/>
                </svg>
              </div>
            </div>
            <label class="weather-control"><span class="weather-label">Wind direction · from bow</span><input id="windSlider" type="range" min="0" max="359" step="1" value="90" aria-label="Wind direction relative to vessel bow: 0 degrees ahead, 180 degrees astern"><span class="weather-label"><strong id="windInputValue">90°</strong></span></label>
            <label class="weather-control"><span class="weather-label">Wave direction · from bow</span><input id="waveSlider" type="range" min="0" max="359" step="1" value="210" aria-label="Wave direction relative to vessel bow: 0 degrees ahead, 180 degrees astern"><span class="weather-label"><strong id="waveInputValue">210°</strong></span></label>
            <label class="weather-control"><span class="weather-label">Weather · BF scale</span><input id="bfSlider" type="range" min="0" max="5" step="1" value="3" aria-label="Beaufort scale value"><span class="weather-label"><strong id="bfInputValue">3 BF</strong></span></label>
            <label class="weather-control"><span class="weather-label">Sea state · DSS scale</span><input id="dssSlider" type="range" min="0" max="4" step="1" value="2" aria-label="Douglas Sea Scale value"><span class="weather-label"><strong id="dssInputValue">DSS 2</strong></span></label>
          </div>
        </section>
      </article>
    </section>
  </main>
  <script>
    (() => {
      const slider = document.getElementById('timeSlider');
      const windSlider = document.getElementById('windSlider');
      const waveSlider = document.getElementById('waveSlider');
      const bfSlider = document.getElementById('bfSlider');
      const dssSlider = document.getElementById('dssSlider');
      const speedGrid = Array.from({length: 21}, (_, i) => 6 + i * 0.5);
      const draftGrid = Array.from({length: 17}, (_, i) => 6 + i * 0.5);
      const baselineExponent = 2;
      const finalExponent = 4;
      const referencePower = 4520;
      const consumptionAxisMax = 20000;
      const clusterDefinitions = [
        {name:'Baseline cluster A', center:[9, 8], surface:'baseline'},
        {name:'Baseline cluster B', center:[12, 10], surface:'baseline'},
        {name:'Baseline cluster C', center:[7.5, 11.5], surface:'baseline'},
        {name:'Baseline cluster D', center:[14.5, 7.5], surface:'baseline'},
        {name:'Final cluster E', center:[14.5, 12.2], surface:'final'},
        {name:'Final cluster F · high consumption', center:[14.5, 8.1], surface:'final'},
        {name:'Final cluster G · low power', center:[7.5, 8.2], surface:'final'},
        {name:'Final cluster H', center:[10.5, 11.5], surface:'final'}
      ];
      const observations = clusterDefinitions.flatMap((definition, clusterIndex) =>
        Array.from({length:36}, (_, offset) => {
          const noiseScale = definition.name === 'Final cluster F · high consumption' ? 0.35 : 1;
          const angle = (offset % 33) * 2.399963229728653;
          const radius = 0.16 + Math.sqrt(offset % 33) * 0.13;
          const noiseValue = Math.sin((clusterIndex + 1) * 127.1 + (offset + 1) * 311.7) * 43758.5453;
          const origin = definition.surface === 'baseline'
            ? clusterIndex === 0 && offset === 0
              ? -2
              : clusterIndex === 3 && offset === 0
                ? 0
                : -2 + Math.random() * 2
            : Math.random() * (3 - 0.35 / 4);
          return {
            month: origin,
            cluster: definition.name,
            surface: definition.surface,
            speed: Math.max(6.2, Math.min(15.8, definition.center[0] + Math.cos(angle) * radius)),
            draft: Math.max(6.2, Math.min(13.8, definition.center[1] + Math.sin(angle) * radius)),
            noise: (noiseValue - Math.floor(noiseValue) - 0.5) * 0.64 * noiseScale
          };
        })
      );
      const pointOpacity = (currentTime, point) => {
        const age = currentTime - point.month;
        const fadeDuration = 0.35;
        if (age < 0 || age >= 2) return 0;
        return age <= 2 - fadeDuration ? 1 : (2 - age) / fadeDuration;
      };
      const pointColor = (currentTime, point) => {
        const colorProgress = Math.max(0, Math.min(1, (point.month + 2) / 5));
        const red = Math.round(255 + (239 - 255) * colorProgress);
        const green = Math.round(255 + (68 - 255) * colorProgress);
        const blue = Math.round(255 + (68 - 255) * colorProgress);
        return `rgba(${red},${green},${blue},${pointOpacity(currentTime, point)})`;
      };
      const speedExponent = progress => baselineExponent + (finalExponent - baselineExponent) * progress;
      const referenceSpeed = 12;
      const referenceDraft = 9;
      const physicsPower = (speed, draft, progress) => {
        const exponent = speedExponent(progress);
        const k = referencePower / (referenceDraft ** (2 / 3) * referenceSpeed ** exponent);
        return k * draft ** (2 / 3) * speed ** exponent;
      };
      const plot = document.getElementById('plot');
      const weatherFactor = (windDirection, waveDirection, beaufort, seaState) => {
        const windExposure = (1 + Math.cos(windDirection * Math.PI / 180)) / 2;
        const waveExposure = (1 + Math.cos(waveDirection * Math.PI / 180)) / 2;
        return 1 + beaufort * (0.018 + 0.012 * windExposure) + seaState * (0.006 + 0.008 * waveExposure);
      };
      const surfaceData = (progress, factor) => draftGrid.map(draft => speedGrid.map(speed => physicsPower(speed,draft,progress) * factor));
      function render() {
        const month = Number(slider.value);
        const timelineMonths = month / 4;
        const progress = Math.sqrt(month / 12);
        const windDirection = Number(windSlider.value);
        const waveDirection = Number(waveSlider.value);
        const beaufort = Number(bfSlider.value);
        const seaState = Number(dssSlider.value);
        const weatherScale = weatherFactor(windDirection, waveDirection, beaufort, seaState);
        const adaptedProgress = progress;
        const traces = [
          {type:'surface', name:'Adapted model', x:speedGrid, y:draftGrid, z:surfaceData(adaptedProgress, weatherScale), opacity:.82, showscale:false, colorscale:[[0,'#246541'],[1,'#a8e34b']], cmin:0, cmax:consumptionAxisMax, hovertemplate:'Speed %{x:.1f} kn<br>Draft %{y:.1f} m<br>Consumption %{z:,.0f} kW<extra>Adapted model</extra>'},
          ...clusterDefinitions.map(cluster => {
            const points = observations.filter(point => point.cluster === cluster.name);
            const clusterProgress = cluster.surface === 'baseline' ? 0 : 1;
            return {type:'scatter3d', mode:'markers', name:cluster.name, x:points.map(point => point.speed), y:points.map(point => point.draft), z:points.map(point => physicsPower(point.speed, point.draft, clusterProgress) * (1 + point.noise) * weatherScale), marker:{size:4,color:points.map(point => pointColor(timelineMonths, point)),showscale:false,line:{width:0}}, hovertemplate:`${cluster.name}<br>Origin: %{customdata:.2f} months from baseline<br>Speed %{x:.1f} kn<br>Draft %{y:.1f} m<br>Consumption %{z:,.0f} kW<extra></extra>`,customdata:points.map(point => point.month)};
          })
        ];
        const layout = {uirevision:'PINN MODEL-speed-draft-consumption-frame',margin:{l:0,r:20,t:12,b:0},paper_bgcolor:'#182337',plot_bgcolor:'#182337',showlegend:false,autosize:true,scene:{uirevision:'PINN MODEL-speed-draft-consumption-frame',xaxis:{title:{text:'SPEED · kn',font:{size:10,color:'#a4afbf'}},range:[6,16],autorange:false,gridcolor:'#344056',zerolinecolor:'#526078',tickfont:{size:9,color:'#a4afbf'},backgroundcolor:'#182337'},yaxis:{title:{text:'DRAFT · m',font:{size:10,color:'#a4afbf'}},range:[6,14],autorange:false,gridcolor:'#344056',zerolinecolor:'#526078',tickfont:{size:9,color:'#a4afbf'},backgroundcolor:'#182337'},zaxis:{title:{text:'CONSUMPTION · kW',font:{size:10,color:'#a4afbf'}},range:[0,consumptionAxisMax],autorange:false,gridcolor:'#344056',zerolinecolor:'#526078',tickfont:{size:9,color:'#a4afbf'},backgroundcolor:'#182337'},camera:{eye:{x:-0.10359333630078289,y:-1.6320817659056865,z:0.15388962650991997}},aspectratio:{x:1.15,y:1,z:.72},bgcolor:'#182337'},font:{family:'Manrope, sans-serif',color:'#eef2f6'}};
        Plotly.react(plot,traces,layout,{responsive:true,displaylogo:false,modeBarButtonsToRemove:['select2d','lasso2d','toImage']});
        const elapsed = month / 4;
        const label = month === 0 ? 'Baseline' : `${Number.isInteger(elapsed) ? elapsed : elapsed.toFixed(1)} ${elapsed === 1 ? 'month' : 'months'}`;
        document.getElementById('timeValue').textContent = label;
        slider.style.setProperty('--progress', `${month / 12 * 100}%`);
        windSlider.style.setProperty('--progress', `${windDirection / 359 * 100}%`);
        waveSlider.style.setProperty('--progress', `${waveDirection / 359 * 100}%`);
        bfSlider.style.setProperty('--progress', `${beaufort / 5 * 100}%`);
        dssSlider.style.setProperty('--progress', `${seaState / 4 * 100}%`);
        document.querySelector('.compass').style.setProperty('--wind-strength', `${beaufort / 5}`);
        document.querySelector('.compass').style.setProperty('--wind-duration', `${2 - beaufort * 0.25}s`);
        document.querySelector('.compass').style.setProperty('--wave-strength', `${seaState / 4}`);
        document.querySelector('.compass').style.setProperty('--wave-duration', `${3 - seaState * 0.2}s`);
        document.getElementById('windInputValue').textContent = `${windDirection}°`;
        document.getElementById('waveInputValue').textContent = `${waveDirection}°`;
        document.getElementById('bfInputValue').textContent = `${beaufort} BF`;
        document.getElementById('dssInputValue').textContent = `DSS ${seaState}`;
        document.getElementById('windBearing').setAttribute('transform', `rotate(${windDirection} 120 120)`);
        document.getElementById('waveBearing').setAttribute('transform', `rotate(${waveDirection} 120 120)`);
      }
      slider.addEventListener('input', render);
      [windSlider, waveSlider, bfSlider, dssSlider].forEach(control => control.addEventListener('input', render));
      window.addEventListener('resize', () => Plotly.Plots.resize(plot));
      render();
    })();
  </script>
</body>
</html>
